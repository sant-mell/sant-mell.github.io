<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rex · Panel de cuidadores</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/parent.css">
</head>
<body>
  <header class="p-top">
    <div class="p-brand">
      <span class="p-dino">🦖</span>
      <div>
        <h1>Rex <span>· Panel de cuidadores</span></h1>
        <p>Configura las rutinas que Rex le recuerda a tu hija o hijo.</p>
      </div>
    </div>
    <a class="p-back" href="index.html">← Volver a Rex</a>
  </header>

  <main class="p-main">
    <!-- ================= ADD / EDIT TASK ================= -->
    <section class="p-card form-card">
      <h2 id="formTitle">Agregar una tarea</h2>
      <form id="taskForm" autocomplete="off">
        <input type="hidden" id="editingId" value="">

        <div class="field">
          <label for="nameEn">Nombre de la tarea</label>
          <input id="nameEn" type="text" required maxlength="40" placeholder="p. ej. Lavar dientes">
        </div>
        <div class="field">
          <label>Categoría</label>
          <div class="needs" id="needPicker"></div>
        </div>

        <div class="grid-2">
          <div class="field">
            <label for="time">Hora</label>
            <input id="time" type="time" value="09:00" required>
          </div>
          <div class="field">
            <label for="headsUp">Aviso previo (min antes)</label>
            <input id="headsUp" type="number" min="0" max="60" value="5">
          </div>
        </div>

        <div class="field">
          <label>Días</label>
          <div class="days" id="daysPicker"></div>
        </div>

        <div class="field">
          <label>Pasos <small>Rex los hace uno por uno</small></label>
          <div id="steps"></div>
          <button type="button" class="ghost add-step" id="addStep">＋ Agregar paso</button>
        </div>

        <div class="field">
          <label for="animFile">Animación de Rex para esta tarea <small>opcional · imagen o GIF</small></label>
          <div class="anim-row">
            <input id="animFile" type="file" accept="image/png,image/jpeg,image/gif,image/webp">
            <img id="animPreview" class="anim-preview" alt="Vista previa de la animación" hidden>
            <button type="button" class="ghost anim-clear" id="animClear" hidden>Quitar</button>
          </div>
          <p class="note">Sube tu propio dibujo de Rex haciendo esta tarea. Se mostrará en el dispositivo durante los pasos.</p>
        </div>

        <div class="grid-2">
          <div class="field">
            <label for="reward">Estrellas de premio</label>
            <input id="reward" type="number" min="1" max="5" value="1">
          </div>
          <div class="field checks">
            <label class="chk"><input type="checkbox" id="parentConfirm"> Necesita que un adulto confirme</label>
            <label class="chk"><input type="checkbox" id="notifyParent" checked> Avísame después de 3 pospuestas</label>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="primary" id="saveBtn">Agregar tarea</button>
          <button type="button" class="ghost" id="clearBtn">Limpiar</button>
        </div>
        <p class="form-msg" id="formMsg"></p>
      </form>
    </section>

    <!-- ================= TASK LIST ================= -->
    <section class="p-card list-card">
      <h2>Tus tareas <span class="count" id="taskCount"></span></h2>
      <ul class="task-list" id="taskList"></ul>
    </section>
  </main>

  <script src="js/parent.js"></script>
</body>
</html>
